name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    name: e2e-ios
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/ios/Podfile') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install Pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/ios/Podfile.lock') }}-
            deriveddata-${{ runner.os }}-

      - name: Build debug simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Grist.xcworkspace \
            -scheme Grist \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available | grep -E '^ +iPhone' | tail -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$udid" ]; then
            xcrun simctl list devices available
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Install app
        run: |
          xcrun simctl install ${{ steps.sim.outputs.udid }} \
            ios/build/Build/Products/Debug-iphonesimulator/Grist.app

      - name: Start Metro
        run: |
          npx expo start --port 8081 -c > "$RUNNER_TEMP/metro.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/status | grep -q packager-status:running; then
              echo "Metro is up"
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/metro.log"
          echo "Metro did not become ready" >&2
          exit 1

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        run: maestro --device ${{ steps.sim.outputs.udid }} test .maestro

      - name: Collect Maestro artifacts
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp -R "$HOME/.maestro/tests" "$RUNNER_TEMP/artifacts/tests" || true
          cp "$RUNNER_TEMP/metro.log" "$RUNNER_TEMP/artifacts/metro.log" || true

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  e2e-android:
    name: e2e-android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mobile/android

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start Metro
        run: |
          npx expo start --port 8081 -c > "$RUNNER_TEMP/metro.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/status | grep -q packager-status:running; then
              echo "Metro is up"
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/metro.log"
          echo "Metro did not become ready" >&2
          exit 1

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DEVICE: emulator-5554
          MAESTRO_BIN: maestro
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile
          script: |
            adb wait-for-device
            adb shell settings put secure stylus_handwriting_enabled 0
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            bash scripts/maestro-android.sh

      - name: Collect Maestro artifacts
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp -R "$HOME/.maestro/tests" "$RUNNER_TEMP/artifacts/tests" || true
          cp "$RUNNER_TEMP/metro.log" "$RUNNER_TEMP/artifacts/metro.log" || true

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
