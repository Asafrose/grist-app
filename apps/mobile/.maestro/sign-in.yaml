appId: com.asafrose.grist
env:
  GRAIN_PAT: ${GRAIN_PAT}
---
- launchApp:
    clearState: true
# The keychain survives clearState, so a previous run may have left a token behind.
- runFlow:
    when:
      visible:
        id: "tab-settings"
    commands:
      - tapOn:
          id: "tab-settings"
      - scrollUntilVisible:
          element:
            id: "sign-out"
          direction: DOWN
      - tapOn:
          id: "sign-out"
- assertVisible: "Personal access token"
- assertVisible: "Where do I get a token?"
- tapOn:
    id: "token-input"
- inputText: "not-a-real-token"
- tapOn:
    id: "continue"
- assertVisible: "Grain didn't accept that token. Check it and try again."
- takeScreenshot: sign-in-error
- tapOn:
    id: "token-input"
- eraseText: 20
- inputText: ${GRAIN_PAT}
- tapOn:
    id: "continue"
- assertVisible: "Meetings"
- takeScreenshot: signed-in-meetings
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "sign-out"
- assertVisible: "Personal access token"
