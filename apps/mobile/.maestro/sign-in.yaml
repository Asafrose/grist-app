appId: com.asafrose.grist
---
# No real token here: this flow signs in with the demo account, so it runs
# without GRAIN_PAT. Only the invalid-token path talks to Grain.
- runFlow: subflows/launch-signed-out.yaml
- assertVisible: "Personal access token"
- assertVisible: "Where do I get a token?"
- assertVisible: "Stored in the device keychain. Only sent to api.grain.com."
- assertVisible:
    id: "continue"
    enabled: false
- tapOn:
    id: "token-input"
- inputText: "not-a-real-token"
- tapOn:
    id: "continue"
- assertVisible: "Grain didn't accept that token. Check it and try again."
- assertNotVisible:
    id: "retry"
- assertVisible: "Personal access token"
- takeScreenshot: sign-in-error
# Editing the token clears the inline error; nothing is ever shown in a modal.
- tapOn:
    id: "token-input"
- eraseText: 20
- inputText: "x"
- assertVisible: "Stored in the device keychain. Only sent to api.grain.com."
- tapOn:
    id: "token-input"
- eraseText: 5
# hideKeyboard presses Back on Android, which pops the screen. The IME action on a
# single-line field closes the keyboard instead; submit() early-returns on the
# empty token, so Enter neither signs in nor errors.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- tapOn:
    id: "demo-sign-in"
- extendedWaitUntil:
    visible: "Meetings"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "meetings-list"
    timeout: 20000
- takeScreenshot: signed-in-meetings
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
- tapOn:
    id: "sign-out"
- assertVisible: "Personal access token"
