appId: com.asafrose.grist
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        id: "tab-settings"
    commands:
      - tapOn:
          id: "tab-settings"
      - scrollUntilVisible:
          element:
            id: "sign-out"
          direction: DOWN
      - tapOn:
          id: "sign-out"
- tapOn:
    id: "demo-sign-in"
- assertVisible: "Meetings"
- extendedWaitUntil:
    visible: ".*Northwind.*"
    timeout: 20000
- tapOn:
    id: "meeting-demo-0"
- assertVisible:
    id: "player-start"
- tapOn:
    id: "actions"
# Native group
- assertVisible:
    id: "action-share"
- assertVisible:
    id: "action-download"
- assertVisible:
    id: "action-tags"
- assertVisible:
    id: "action-copy-transcript"
- assertVisible:
    id: "action-rename"
# In Grain group
- assertVisible: "In Grain"
- assertVisible:
    id: "action-grain-comments"
- assertVisible:
    id: "action-grain-playlist"
- assertVisible:
    id: "action-grain-viewers"
- assertVisible:
    id: "action-grain-integrations"
- takeScreenshot: actions
# Copy transcript works offline in demo mode
- tapOn:
    id: "action-copy-transcript"
- assertVisible: "Copied"
# Download for offline marks the demo recording as available
- tapOn:
    id: "action-download"
- assertVisible: "Downloaded.*"
- takeScreenshot: actions-downloaded
# Rename inline, validate, save
- tapOn:
    id: "action-rename"
- assertVisible:
    id: "rename-input"
- tapOn:
    id: "rename-input"
- eraseText: 120
- inputText: "Renamed from the sheet"
- takeScreenshot: actions-rename
- tapOn:
    id: "rename-save"
- assertNotVisible:
    id: "rename-input"
- assertVisible: "Renamed from the sheet"
# Close the sheet and confirm the meeting title changed
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "actions-close"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          direction: DOWN
- assertNotVisible:
    id: "actions-sheet"
- assertVisible: "Renamed from the sheet"
- assertVisible:
    id: "meeting-tabs"
# The downloaded meeting carries the list glyph and is reachable from Settings
- tapOn:
    id: "header-back"
- assertVisible:
    id: "meetings-list"
- assertVisible:
    id: "downloaded-.*"
- takeScreenshot: meetings-downloaded
- tapOn:
    id: "tab-settings"
- assertVisible: "Storage"
- runFlow:
    when:
      notVisible:
        id: "open-downloads"
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 40%
          duration: 400
- tapOn:
    id: "open-downloads"
- assertVisible:
    id: "downloads-screen"
# The row exposes one composite accessibility label, so match the title inside it
- assertVisible: ".*Renamed from the sheet.*"
- takeScreenshot: downloads
- tapOn:
    id: "header-back"
- assertVisible: "Storage"
