appId: com.asafrose.grist
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        id: "tab-settings"
    commands:
      - tapOn:
          id: "tab-settings"
      - scrollUntilVisible:
          element:
            id: "sign-out"
          direction: DOWN
      - tapOn:
          id: "sign-out"
- tapOn:
    id: "demo-sign-in"
- assertVisible: "Meetings"
- extendedWaitUntil:
    visible: ".*Northwind.*"
    timeout: 20000
- tapOn:
    id: "meeting-demo-0"
# Shell: pinned player, tab strip, actions button
- assertVisible:
    id: "player-start"
- assertVisible:
    id: "meeting-tabs"
- assertVisible:
    id: "meeting-tab-summary"
- assertVisible:
    id: "meeting-tab-transcript"
- assertVisible:
    id: "meeting-tab-timeline"
- assertVisible:
    id: "meeting-tab-clips"
- assertVisible:
    id: "actions"
- assertVisible: "Action items"
- takeScreenshot: meeting-summary
# A timestamp chip seeks the player
- assertVisible:
    id: "ts-.*"
- tapOn:
    id: "ts-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "play-pause"
    timeout: 30000
- assertNotVisible:
    id: "position"
    text: "0:00"
- takeScreenshot: meeting-summary-seeked
# Scrolling the summary down collapses the player card; title and tabs stay pinned,
# and the mini player takes over while the recording plays.
- repeat:
    times: 2
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 35%
          duration: 500
- assertVisible:
    id: "meeting-tabs"
- assertVisible:
    id: "meeting-tab-summary"
- assertNotVisible:
    id: "play-pause"
- assertVisible:
    id: "mini-player"
- takeScreenshot: meeting-player-collapsed
# Reading back up mid-list leaves the card collapsed.
- swipe:
    start: 50%, 50%
    end: 50%, 65%
    duration: 900
- assertNotVisible:
    id: "play-pause"
- assertVisible:
    id: "mini-player"
# Only scrolling the list back to the top brings the card back.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 90%
          duration: 500
- assertVisible:
    id: "play-pause"
- assertNotVisible:
    id: "mini-player"
- takeScreenshot: meeting-player-restored
# Tab strip switches and comes back
- tapOn:
    id: "meeting-tab-transcript"
- assertVisible:
    id: "transcript-tab"
- assertNotVisible: "Action items"
- takeScreenshot: meeting-transcript-tab
- tapOn:
    id: "meeting-tab-summary"
- assertVisible: "Action items"
- tapOn: "Meetings"
- assertVisible:
    id: "meetings-list"
# The seeked recording shows its remaining time in the list.
- extendedWaitUntil:
    visible: ".*min left.*"
    timeout: 15000
- takeScreenshot: meetings-progress
# Mini player: hidden on the playing meeting, present elsewhere, taps back into it.
- assertVisible:
    id: "mini-player"
- tapOn:
    id: "tab-search"
- assertVisible:
    id: "mini-player"
- takeScreenshot: mini-player
- tapOn:
    id: "mini-player"
- assertVisible:
    id: "meeting-tabs"
- assertNotVisible:
    id: "mini-player"
- tapOn: "Meetings"
- tapOn:
    id: "tab-index"
- assertVisible:
    id: "mini-player"
- tapOn:
    id: "mini-close"
- assertNotVisible:
    id: "mini-player"
# Reopening the meeting we seeked shows the resume time before play, paused on that frame.
- tapOn:
    id: "meeting-demo-0"
- extendedWaitUntil:
    visible:
      id: "play-pause"
    timeout: 30000
- assertVisible: "Play"
- assertNotVisible:
    id: "position"
    text: "0:00"
- takeScreenshot: meeting-resume-preplay
# Seeking a meeting that has never been started leaves it paused at the new position.
- tapOn: "Meetings"
- tapOn:
    id: "meeting-demo-1"
- assertVisible:
    id: "player-start"
- tapOn:
    id: "seek-forward"
- extendedWaitUntil:
    visible:
      id: "play-pause"
    timeout: 30000
- assertVisible: "Play"
- assertNotVisible:
    id: "position"
    text: "0:00"
- takeScreenshot: meeting-seek-paused
# The thumbnail poster covers the video surface while the next meeting loads.
# demo-2 is the fixture with a thumbnail, so the poster is visible here.
- tapOn: "Meetings"
- tapOn:
    id: "meeting-demo-2"
- assertVisible:
    id: "player-start"
- tapOn:
    id: "player-start"
- takeScreenshot: meeting-poster
- extendedWaitUntil:
    visible:
      id: "play-pause"
    timeout: 30000
- tapOn:
    id: "play-pause"
- assertVisible: "Play"
