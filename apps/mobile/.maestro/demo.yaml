appId: com.asafrose.grist
---
- runFlow: subflows/demo-sign-in.yaml
- extendedWaitUntil:
    visible: ".*Northwind.*"
    timeout: 20000
- takeScreenshot: demo-meetings
- tapOn:
    id: "meeting-demo-0"
- assertVisible:
    id: "player-start"
- takeScreenshot: demo-meeting
- tapOn:
    id: "header-back"
- assertVisible:
    id: "meetings-list"
