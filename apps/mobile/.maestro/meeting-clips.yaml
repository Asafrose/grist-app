appId: com.asafrose.grist
---
- runFlow: subflows/demo-sign-in.yaml
# Empty state: the first demo meeting has no clips
- extendedWaitUntil:
    visible: ".*Northwind.*"
    timeout: 20000
- tapOn:
    id: "meeting-demo-0"
- assertVisible:
    id: "meeting-tabs"
- tapOn:
    id: "meeting-tab-clips"
- assertVisible:
    id: "clips-empty"
- assertVisible: "No clips yet"
- assertVisible:
    id: "clips-open-grain"
- takeScreenshot: meeting-clips-empty
- tapOn:
    id: "clips-open-grain"
- extendedWaitUntil:
    notVisible:
      id: "clips-empty"
    timeout: 10000
# iOS closes the in-app browser with Done; an Android Custom Tab has no such button.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible:
    id: "clips-empty"
- tapOn:
    id: "header-back"
# Clip cards: enter via the Clips feed, which deep-links to ?tab=clips&clip=<id>
- tapOn:
    id: "tab-clips"
- extendedWaitUntil:
    visible:
      id: "clip-.*"
    timeout: 20000
- tapOn:
    id: "clip-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "clip-card-.*"
    timeout: 10000
- assertVisible: ".*starts .*"
- takeScreenshot: meeting-clips
# Tapping the card plays the clip range in the pinned player
- tapOn:
    id: "clip-card-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "play-pause"
    timeout: 30000
- assertNotVisible:
    id: "position"
    text: "0:00"
- takeScreenshot: meeting-clips-playing
- tapOn:
    id: "header-back"
- tapOn:
    id: "tab-index"
- assertVisible:
    id: "meetings-list"
