appId: com.asafrose.grist
---
- runFlow: subflows/demo-sign-in.yaml
- extendedWaitUntil:
    visible: ".*Northwind.*"
    timeout: 20000
- assertVisible: "TODAY|YESTERDAY"
- assertVisible:
    id: "view-mine"
- assertVisible: ".*External.*"
- takeScreenshot: meetings-list
# New badge: demo-0 starts 2h ago and has never been opened; demo-5 is 50h old.
- assertVisible:
    id: "new-demo-0"
- scrollUntilVisible:
    element:
      id: "meeting-demo-5"
    direction: DOWN
- assertNotVisible:
    id: "new-demo-5"
- scrollUntilVisible:
    element:
      id: "meeting-demo-0"
    direction: UP
- takeScreenshot: meetings-new-badge
# Open a meeting before filtering: after the list re-renders, Maestro's positions for
# recycled FlashList cells go stale on iOS and taps miss.
- tapOn:
    id: "meeting-demo-0"
- extendedWaitUntil:
    visible:
      id: "player-start"
    timeout: 10000
- tapOn:
    id: "header-back"
- assertVisible:
    id: "meetings-list"
- assertNotVisible:
    id: "new-demo-0"
- takeScreenshot: meetings-new-badge-cleared
# Title filter narrows the list locally.
- tapOn:
    id: "title-filter"
- inputText: "Fabrikam"
- assertVisible: ".*Fabrikam.*"
- assertNotVisible: ".*Relecloud.*"
- takeScreenshot: meetings-title-filter
- tapOn:
    id: "title-filter-clear"
# hideKeyboard presses Back on Android, which pops the screen. The IME action on a
# single-line field closes the keyboard instead; title-filter has no onSubmitEditing,
# so Enter changes nothing.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- assertVisible: ".*Relecloud.*"
# Workspace and team chips.
- tapOn:
    id: "view-workspace"
- assertVisible: ".*Northwind.*"
- tapOn:
    id: "view-mine"
# With six demo teams the header collapses the rest behind a +N chip.
- assertVisible:
    id: "view-more"
- tapOn:
    id: "view-more"
- assertVisible:
    id: "view-picker"
- takeScreenshot: view-picker
# Android has no drag-to-dismiss on the form sheet, so it taps the close control.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "view-picker-close"
- runFlow:
    when:
      platform: iOS
    commands:
      # The sheet opens at the 0.6 detent; dragging the dimmed backdrop above it dismisses it.
      - swipe:
          start: "50%,8%"
          end: "50%,90%"
          duration: 400
- assertNotVisible:
    id: "view-picker"
- tapOn:
    id: "view-more"
- assertVisible:
    id: "view-picker"
- tapOn:
    id: "picker-view-team-demo-team-5"
- assertVisible:
    id: "view-team-demo-team-5"
- takeScreenshot: meetings-view-overflow
- tapOn:
    id: "view-mine"
# Filters sheet: choose External, apply, see count and chip.
- tapOn:
    id: "open-filters"
- assertVisible: "Filters"
- assertVisible: ".*Show .* meetings?.*"
- tapOn:
    id: "scope-external"
- assertVisible: ".*Show .* meetings?.*"
- takeScreenshot: filters-sheet
- tapOn:
    id: "filters-apply"
- assertVisible:
    id: "active-scope"
- assertNotVisible: ".*Internal.*"
- takeScreenshot: meetings-external
# Reset from the sheet clears the chip.
- tapOn:
    id: "active-scope"
- assertVisible: "Filters"
- tapOn:
    id: "filters-reset"
- tapOn:
    id: "filters-apply"
- assertNotVisible:
    id: "active-scope"
# Date preset: the count follows the draft and the chip names the range.
- tapOn:
    id: "open-filters"
- tapOn:
    id: "date-30d"
- assertVisible: ".*Show .* meetings?.*"
- tapOn:
    id: "filters-apply"
- assertVisible:
    id: "active-date"
- assertVisible: "Last 30 days"
# Custom range replaces the preset; both ends are editable in the sheet.
- tapOn:
    id: "active-date"
- tapOn:
    id: "date-custom"
- assertVisible:
    id: "date-from"
- assertVisible:
    id: "date-to"
- tapOn:
    id: "date-custom"
- tapOn:
    id: "filters-reset"
- tapOn:
    id: "filters-apply"
- assertNotVisible:
    id: "active-date"
# Meeting type and team chips round-trip to the list.
- tapOn:
    id: "open-filters"
- tapOn:
    id: "type-.*"
    index: 0
- tapOn:
    id: "filters-apply"
- assertVisible:
    id: "active-meetingTypeId"
- tapOn:
    id: "active-meetingTypeId"
- tapOn:
    id: "team-.*"
    index: 0
- tapOn:
    id: "filters-apply"
- assertVisible:
    id: "view-team-.*"
- takeScreenshot: meetings-team
- tapOn:
    id: "active-meetingTypeId"
- tapOn:
    id: "filters-reset"
- tapOn:
    id: "filters-apply"
- assertVisible:
    id: "view-mine"
- assertNotVisible:
    id: "active-meetingTypeId"
# More card: participant, tag and recorder each expand and filter.
- tapOn:
    id: "open-filters"
- scrollUntilVisible:
    element:
      id: "more-participant"
    direction: DOWN
- tapOn:
    id: "more-participant"
- tapOn:
    id: "participant-.*"
    index: 0
- tapOn:
    id: "more-participant"
- tapOn:
    id: "more-tag"
- assertVisible:
    id: "more-recorder"
- tapOn:
    id: "more-recorder"
- tapOn:
    id: "recorder-.*"
    index: 0
- assertVisible: ".*Show .* meetings?.*"
- takeScreenshot: filters-more
- tapOn:
    id: "filters-apply"
- assertVisible:
    id: "active-participant"
- assertVisible:
    id: "active-recorderId"
# Reset clears every chip at once.
- tapOn:
    id: "active-participant"
- tapOn:
    id: "filters-reset"
- tapOn:
    id: "filters-apply"
- assertNotVisible:
    id: "active-participant"
- assertNotVisible:
    id: "active-recorderId"
# Dismissing the sheet without applying: Android has no drag-to-dismiss, so it uses the
# header close button; iOS drags the sheet down.
- tapOn:
    id: "open-filters"
- assertVisible:
    id: "filters-sheet"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "filters-close"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%,8%"
          end: "50%,90%"
- assertNotVisible:
    id: "filters-sheet"
- assertVisible:
    id: "meetings-list"
# Rows open the meeting screen.
