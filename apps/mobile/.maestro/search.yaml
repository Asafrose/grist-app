appId: com.asafrose.grist
---
- runFlow: subflows/demo-sign-in.yaml
- extendedWaitUntil:
    visible: ".*Northwind.*"
    timeout: 20000
- tapOn:
    id: "tab-search"
- assertVisible:
    id: "search-input"
- assertVisible: ".*of .* meetings indexed on this device.*"
- takeScreenshot: search-empty
- tapOn:
    id: "search-input"
- inputText: "pricing"
- extendedWaitUntil:
    visible: ".*Pricing review.*"
    timeout: 5000
- assertVisible: ".*matches.*"
- takeScreenshot: search-titles
- tapOn:
    id: "segment-transcripts"
- extendedWaitUntil:
    visible: ".*we do not price.*"
    timeout: 5000
- takeScreenshot: search-transcripts
# hideKeyboard presses Back on Android, which pops the screen. The IME action on a
# single-line field closes the keyboard instead. Enter also re-remembers the query,
# which only surfaces in the recents list once the field is empty.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
# Tap by the unique time chip: after the list re-renders, Maestro's element positions
# for recycled FlashList cells go stale on iOS and id-based taps miss.
- tapOn: ".*0:04"
- extendedWaitUntil:
    visible:
      id: "play-pause"
    timeout: 30000
- assertNotVisible:
    id: "search-input"
- takeScreenshot: search-opened-meeting
