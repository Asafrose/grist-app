appId: com.asafrose.grist
---
- runFlow: subflows/demo-sign-in.yaml
- extendedWaitUntil:
    visible: ".*Northwind.*"
    timeout: 20000
- tapOn:
    id: "tab-settings"
- assertVisible: "Settings"
- assertVisible: "Default view"
- assertVisible: "Playback"
- assertVisible: "Storage"
- extendedWaitUntil:
    visible:
      id: "profile-name"
    timeout: 10000
- assertVisible:
    text: ".*24 meetings.*"
- takeScreenshot: settings
- assertVisible:
    text: ".*1×.*"
- tapOn:
    id: "setting-rate"
- tapOn:
    id: "setting-rate-option-1.5"
- assertVisible:
    text: ".*1.5×.*"
# Default view: pick a team, then see the meetings screen open on it.
- tapOn:
    id: "setting-default-view"
- tapOn:
    id: "setting-default-view-option-team:demo-team-1"
- assertVisible:
    id: "setting-default-view-value"
    text: "Customer Success"
- takeScreenshot: settings-default-view
- tapOn:
    id: "tab-index"
- assertVisible:
    id: "view-team-demo-team-1"
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "setting-default-view"
- tapOn:
    id: "setting-default-view-option-mine"
- tapOn:
    id: "clear-index"
- assertVisible:
    text: ".*0 meetings.*"
- scrollUntilVisible:
    element:
      id: "token-masked"
    direction: DOWN
- assertVisible:
    text: ".*demo••••.*"
- assertVisible: "Account"
- scrollUntilVisible:
    element: "Open source · Not affiliated with Grain"
    direction: DOWN
- assertVisible: "About"
- takeScreenshot: settings-bottom
- tapOn:
    id: "sign-out"
- assertVisible: "Personal access token"
