appId: com.asafrose.grist
env:
  GRAIN_PAT: ${GRAIN_PAT}
---
- launchApp
- runFlow:
    when:
      visible: "Personal access token"
    commands:
      - tapOn:
          id: "token-input"
      - inputText: ${GRAIN_PAT}
      - tapOn:
          id: "continue"
- assertVisible: "Meetings"
- extendedWaitUntil:
    visible:
      id: "meetings-list"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Syncing your meetings…"
    timeout: 60000
- takeScreenshot: meetings-list
# Kill and relaunch: the list must come from SQLite before any network call.
- stopApp
- launchApp
- assertVisible: "Meetings"
- assertVisible:
    id: "meetings-list"
- tapOn:
    id: "meeting-demo-0"
# A meeting played in an earlier run opens preloaded and paused, so start from whichever
# control the card is showing.
- runFlow:
    when:
      visible:
        id: "player-start"
    commands:
      - tapOn:
          id: "player-start"
- extendedWaitUntil:
    visible:
      id: "play-pause"
    timeout: 30000
- runFlow:
    when:
      visible: "Play"
    commands:
      - tapOn:
          id: "play-pause"
- assertVisible: "Pause"
- takeScreenshot: meeting-playing
- tapOn:
    id: "rate"
- tapOn:
    id: "rate-1.5"
- tapOn:
    id: "seek-forward"
- tapOn:
    id: "play-pause"
- assertVisible: "Play"
- tapOn:
    id: "play-pause"
# Background the app: video enters PiP, audio keeps going.
- pressKey: home
- takeScreenshot: pip-home
- swipe:
    direction: DOWN
    duration: 100
- launchApp:
    stopApp: false
- assertVisible: "Pause"
- takeScreenshot: meeting-foreground
- tapOn:
    id: "header-back"
- assertVisible:
    id: "meetings-list"
